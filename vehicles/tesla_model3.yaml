# The Isaac ego: a plausible real Tesla Model 3 on the CARLA Model 3 body's geometry.
#
# This file is the single source of truth for the vehicle. `just generate` writes from it:
#   - Autoware's vehicle description (aib_vehicle_description/config/vehicle_info.param.yaml,
#     mirror.param.yaml)
#   - the sensor kit (aib_sensor_kit_description/config/sensors_calibration.yaml,
#     sensor_kit_calibration.yaml, urdf/sensor_kit.xacro, and the same calibration under
#     aib_individual_params/config/default/aib_sensor_kit/)
#   - the Isaac rig the library builds the PhysX vehicle and sensors from
#     (src/aib/config/tesla_model3.rig.yaml)
# and `just check-generated` fails when any of them is stale. Format: docs/spec-format.md.
#
# Values come from carla-scenario-bridge (csb) as of commit 4aefee8 ("the ego is a plausible
# real Model 3, not CARLA's car", roadmap 043): src/csb_isaac/csb_isaac/vehicle_params.py,
# config/acb_ego.yaml, and acb's vehicle_info / sensor kit calibration it read. The drivetrain,
# the mass and the road loads are the Model 3 RWD's (2024 "Highland", rear 3D7 motor) from
# published data: no drive logs exist to fit against. Values marked under `provenance` with
# `assumed: true` are estimates, not measurements.
spec_version: 1
name: tesla_model3
description: Tesla Model 3 RWD (physics, drivetrain) on the CARLA vehicle.tesla.model3 body (geometry)

autoware:
  vehicle_model: aib_vehicle
  sensor_model: aib_sensor_kit

body:
  # The visual body a host may put on the vehicle: a CARLA blueprint id in csb's vehicle
  # catalogue (SWB_VEHICLE_USD, CSB_VEHICLE_USD before swb roadmap 046). Without a catalogue the chassis is the box below.
  catalogue_model: vehicle.tesla.model3

# What Autoware plans with (vehicle_info), and the PhysX wheel layout. base_link is the rear
# axle centre on the ground, x forward, y left, z up. Metres, radians.
geometry:
  wheel_base: 3.005
  wheel_tread: 1.667
  wheel_radius: 0.370
  wheel_width: 0.235
  front_overhang: 0.923
  rear_overhang: 0.864
  left_overhang: 0.248
  right_overhang: 0.248
  vehicle_height: 1.488
  # Bicycle-model tire angle limit: a planning limit (acb docs/issues/006), about a real car's
  max_steer_angle: 0.70

# mirror.param.yaml: only Autoware's planning simulator and the sensing crop box read it.
mirror:
  min_longitudinal_offset: 1.8
  max_longitudinal_offset: 3.2
  min_lateral_offset: -1.4
  max_lateral_offset: 1.4
  min_height_offset: 0.8
  max_height_offset: 1.5

inertia:
  mass: 1760.0                # kg, curb (RWD)
  com_front_fraction: 0.47    # share of the static load on the front axle (CoM from rear axle / wheel base)
  com_lateral: 0.0            # m, + left
  com_height: 0.46            # m above the ground
  # Inertia as of a uniform box this size (m): mass/12 x (l^2 + w^2) etc.
  inertia_box: [4.8, 1.9, 1.4]

wheels:
  mass: 20.0                  # kg each; moment of inertia 0.5 m r^2
  damping_rate: 0.25

tires:
  friction: 1.0               # dry asphalt
  lat_stiff_max_load: 2.0     # in rest loads: where lateral stiffness stops growing
  lat_stiff_value: 17.0       # lateral stiffness there, N/rad per N of rest load
  long_stiff_value: 4612.5    # kg (x g: N per unit slip): 10 x a quarter-car rest load
  # Grip (x the table's friction) vs longitudinal slip: full to the peak at 0.1, falling
  # linearly to 0.8 with the wheel locked (provenance: tires.friction_vs_slip)
  friction_vs_slip: [[0.0, 1.0], [0.1, 1.0], [1.0, 0.8]]

brakes:
  max_brake_torque: 3000.0    # N m per wheel: past the tires, so a stop is friction-limited
  hold_brake_torque: 1500.0   # N m per wheel, standing still or in park
  distribution: dynamic_axle_load   # ideal distribution (EBD): front share = dynamic front load
  # The hydraulics (ev): a pure dead time, then the pressure's first-order build-up.
  dead_time: 0.08             # s
  time_constant: 0.06         # s
  # ABS (ev): each wheel's pressure released while its slip is past slip_release and
  # reapplied once it is back within slip_reapply; off below min_speed (m/s).
  abs: {enabled: true, slip_release: 0.25, slip_reapply: 0.15, release_rate: 8.0, apply_rate: 4.0, min_speed: 1.5}

powertrain:
  # The seam (docs/design.md, "Powertrain"): `ideal` realizes Autoware's acceleration as
  # per-wheel torque m a + F_resist(v), the contract acb has on CARLA; `ev` is the Model 3 RWD
  # drive unit below (motor envelope and lag, regen blended with the friction brakes, ABS,
  # traction control). `physx` (PhysX DriveStandard) and `fmu` are reserved.
  model: ev
  max_drive_torque: 1500.0    # N m per wheel (ideal only): ~8 m/s^2
  # ev: one motor on the rear axle through a single-speed reduction and an open differential
  drive_axle: rear
  gear_ratio: 10.0            # effective: Tesla's 9.03:1 for the CARLA body's larger wheel (provenance)
  motor_peak_torque: 340.0    # N m at the motor, to base speed (194 kW / 340 N m = 5450 rpm)
  motor_peak_power: 194000.0  # W, constant above base speed
  motor_max_rpm: 15200.0      # torque tapers to 0 over the last 5 %: ~201 km/h
  motor_time_constant: 0.04   # s, first-order torque lag (inverter, motor, driveline)
  regen_max_torque: 130.0     # N m at the motor: ~0.2 g at the wheels
  regen_max_power: 60000.0    # W
  regen_fade_speeds: [1.0, 3.0]   # m/s: no regen at or below the first, full at or above the second
  traction_control: {enabled: true, slip_limit: 0.25, slip_reapply: 0.15, release_rate: 20.0, apply_rate: 5.0}

# Road loads, applied to the body as a force (whatever the powertrain): rolling resistance
# Crr m g and aerodynamic drag rho Cd A v^2 / 2. The powertrains' feedforward includes them.
resistance:
  rolling_coefficient: 0.0095
  drag_coefficient: 0.23
  frontal_area: 2.2           # m^2
  air_density: 1.2            # kg/m^3

steering:
  ackermann: true             # the bicycle angle split into Ackermann angles for the front wheels
  time_constant: 0.0          # s, first-order actuator lag; 0: none
  rate_limit: 0.0             # rad/s; 0: none

suspension:
  frequency: 1.6              # Hz, per axle on its own sprung mass, so the car sits level
  damping_ratio: 0.45
  travel: 0.2                 # m

physx:
  # The wheel's spin is stiff against the tire: at 1 substep per 1/60 s braking went unstable
  # and locked the wheels (csb roadmap 043). 8 substeps at every speed and a 4 m/s active
  # slip denominator track the request.
  substeps: 8
  substep_threshold_speed: 5.0
  min_active_slip_denominator: 4.0
  min_passive_slip_denominator: 4.0
  min_lateral_slip_denominator: 1.0
  sticky_tire_threshold_speed: 0.2
  sticky_tire_threshold_time: 1.0
  longitudinal_sticky_tire_damping: 200.0
  lateral_sticky_tire_damping: 20.0

# The sensor kit: base_link -> sensor_kit_base_link, then each sensor's mount in the kit.
# Mounts are what csb's Isaac ego uses today (acb's acb_sensor_kit calibration).
sensor_kit:
  mount: {x: 0.9, y: 0.0, z: 2.0, roll: -0.001, pitch: 0.015, yaw: -0.0364}

sensors:
  top:
    type: lidar
    calibration_key: velodyne_top_base_link   # the key in sensor_kit_calibration.yaml
    link: top_base_link                       # URDF link the mount places
    frame: top                                # frame_id of the messages (child of link, identity)
    topic: /sensing/lidar/top/pointcloud_before_sync
    mount: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 1.575}
    channels: 128
    rate_hz: 20.0
    range: 200.0
    vertical_fov: [-25.0, 15.0]   # deg (CARLA's ray-cast lidar beside it)
    isaac:
      enabled: true
      config: OS1
      variant: OS1_REV7_128ch20hz1024res
  camera6:
    type: camera
    calibration_key: camera6/camera_link
    link: camera6/camera_link
    frame: camera6/camera_optical_link
    topic: /sensing/camera/camera6/image_raw
    info_topic: /sensing/camera/camera6/camera_info
    mount: {x: 0.0, y: 0.0, z: 0.0, roll: 0.0, pitch: 0.0, yaw: 0.0}
    width: 1280
    height: 720
    horizontal_fov: 74.5    # deg
    rate_hz: 10.0
    isaac:
      # Off as on csb today: traffic lights reach Autoware by V2X (fusion only), not this camera.
      enabled: false
  imu:
    type: imu
    calibration_key: imu_link
    link: imu_link
    frame: imu_link
    topic: /sensing/imu/imu_link/imu_raw
    mount: {x: 0.0, y: 0.0, z: 0.0, roll: 3.14159265359, pitch: 0.0, yaw: 3.14159265359}
    isaac:
      enabled: true
  gnss:
    type: gnss
    calibration_key: gnss_link
    link: gnss_link
    frame: gnss_link
    topic: /sensing/gnss/gnss_link/nav_sat_fix
    mount: {x: -0.1, y: 0.0, z: -0.2, roll: 0.0, pitch: 0.0, yaw: 0.0}
    rate_hz: 10.0
    isaac:
      enabled: true

# Where each number comes from. `assumed: true` marks an estimate to replace with a
# measurement when one exists.
provenance:
  geometry: {basis: "acb vehicle_info: CARLA 0.9.16 vehicle.tesla.model3 (a real Model 3 is 2.875 / 1.58 / 0.334 m); kept so Autoware, the body and the physics are one car"}
  inertia.mass: {basis: "Model 3 RWD (2024) curb mass 1760 kg (evspecifications.com/en/model/5f1c3d0)"}
  inertia.com_front_fraction: {assumed: true, basis: "road-test weight splits around 47-48 % front; the RWD's rear motor puts it at the low end"}
  inertia.com_height: {assumed: true, basis: "a floor battery pack puts the CoM low"}
  inertia.inertia_box: {assumed: true, basis: "uniform box of the body: yaw 3909 kg m^2 at 1760 kg, close to m a b = 3959"}
  wheels.mass: {assumed: true, basis: "a wheel and tire of this size"}
  tires: {assumed: true, basis: "dry asphalt; the PhysX vehicle's usual passenger-car tire"}
  tires.friction_vs_slip: {assumed: true, basis: "dry asphalt grip falls past its peak to 0.65 (Burckhardt model, dry asphalt: c1 1.2801, c2 23.99, c3 0.52: peak 1.17 at slip 0.17, 0.76 locked) to 0.92 (Pacejka Magic Formula, dry tarmac B 10, C 1.9, D 1, E 0.97, as in MathWorks' Tire-Road Interaction (Magic Formula) block: 0.91 locked) of the peak when the wheel locks; 0.8 is between. The peak sits at 0.1 because this PhysX tire's force saturates there (longitudinal stiffness 10 x the rest load). User decision 2026-10-19; it applies to ideal and ev alike"}
  brakes.max_brake_torque: {basis: "chosen past the tire limit, so a stop is friction-limited (~1 g) as on a real car"}
  brakes.dead_time: {assumed: true, basis: "a brake-by-wire booster (Model 3: Bosch iBooster) builds pressure in ~0.1-0.2 s; dead time of order 0.1 s"}
  brakes.time_constant: {assumed: true, basis: "with dead_time: ~95 % of the requested pressure 0.26 s after the request"}
  brakes.abs: {assumed: true, basis: "tuned in Isaac (aib.steptest brake_100, 2026-10-19): PhysX slip at the tire peak is ~0.1-0.13 under braking load; release past 0.25 / reapply below 0.15 at 8 / 4 per s stopped shortest of five settings on a realistic friction curve, and never locked"}
  powertrain.max_drive_torque: {basis: "chosen: ~8 m/s^2, beyond what Autoware asks (ideal)"}
  powertrain.drive_axle: {basis: "Model 3 RWD: one rear permanent-magnet motor (3D7), no front motor (Tesla Model 3 owner's manual, Motor Type(s))"}
  powertrain.gear_ratio: {basis: "Tesla Model 3 owner's manual: single-speed fixed gear 9.03:1; scaled by 0.370 / 0.334 m (the CARLA body's wheel vs the Model 3's 235/45R18) so the force at the road and the motor speed per road speed are the real car's"}
  powertrain.motor_peak_torque: {basis: "Tesla Model 3 owner's manual, motor 3D7: 194 kW, 340 N m; evspecifications lists 194 kW at 5400 rpm (440 N m there is not Tesla's figure)"}
  powertrain.motor_peak_power: {basis: "Tesla Model 3 owner's manual, motor 3D7: 194 kW; peak, i.e. battery and inverter permitting"}
  powertrain.motor_max_rpm: {assumed: true, basis: "set so that the taper reaches Tesla's 201 km/h top speed (Model 3 RWD 2024)"}
  powertrain.motor_time_constant: {assumed: true, basis: "inverter torque response is a few ms; the driveline's anti-jerk shaping makes the wheel torque's tens of ms"}
  powertrain.regen_max_torque: {assumed: true, basis: "Tesla quoted 0.2 g maximum regen deceleration for Model 3 (0.3 g in Track Mode; Electrek 2018); 0.2 g x 1760 kg x 0.370 m / 10.0"}
  powertrain.regen_max_power: {assumed: true, basis: "owner reports of ~60-70 kW peak regen for Model 3 (no Tesla figure); 60 kW"}
  powertrain.regen_fade_speeds: {assumed: true, basis: "regen fades out at walking pace, where the friction brakes (hold) take over"}
  powertrain.traction_control: {assumed: true, basis: "slip limit just past the PhysX tire's peak under drive; motor torque cut fast (the inverter acts in ms)"}
  resistance.rolling_coefficient: {assumed: true, basis: "low-rolling-resistance OEM tires (Model 3: Michelin Primacy MXM4 class), Crr 0.008-0.010"}
  resistance.drag_coefficient: {basis: "Tesla: Cd 0.23 for Model 3"}
  resistance.frontal_area: {assumed: true, basis: "~2.2 m^2, InsideEVs / Engineering Explained estimate (from the Model S's)"}
  suspension: {assumed: true, basis: "a sedan's ride"}
  physx: {basis: "csb roadmap 043: the braking instability fix"}
  sensors: {basis: "acb acb_sensor_kit calibration, as csb's Isaac ego mounts it"}
