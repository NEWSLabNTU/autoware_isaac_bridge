# The drift car's ego run (scenario-world-bridge roadmap 057): drift_mustang's rig, and the
# Control taken from autoware-drift's drift_controller, which sits between Autoware's command
# gate (/control/command/control_cmd) and the car: it passes Autoware's command through, and
# replaces it while a drift runs. The world steps in lockstep with the ego's localizer (aib.ros):
# each frame waits for NDT's pose for the last scan, so the car's computer keeps up at any speed.
rig: drift_mustang.rig.yaml
domain: 1
node_name: isaac_vehicle
control_topic: /control/command/drift/control_cmd
lockstep: {topic: /localization/pose_estimator/pose_with_covariance, timeout_s: 1.0}
vehicle: {}
ecu: {}
sensors: {}
