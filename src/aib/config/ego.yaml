# An ego run (aib.rig.EgoConfig): which vehicle, on which ROS domain, as which node. Stamps are
# Isaac's sim time + BASE_NS (aib.sim_time); there is no clock setting.
# The vehicle itself is the rig, generated from its spec
# (deps/sim_vehicle_spec/vehicles/<name>.yaml): edit the
# spec and `just generate`, not the rig. Paths are relative to this file.
rig: tesla_model3.rig.yaml
# The ego's ROS domain: Autoware runs there (`just autoware`, `ROS_DOMAIN_ID`).
domain: 1
node_name: isaac_vehicle
# Hand overrides, applied last (for experiments; a lasting change belongs in the spec).
# The PhysX vehicle: any VehicleParams field by name (aib/params.py), e.g. `mass: 1900.0`,
# `tire_friction: 0.7`.
vehicle: {}
# The onboard computers (deps/sim_vehicle_ecu): any Calibration field by name
# (sim_vehicle_ecu/calibration.py), e.g. `esc_enabled: true`, `abs_slip_release: 0.3`.
ecu: {}
# Per sensor: enabled, topic, frame, rate_hz, isaac, e.g. `camera6: {enabled: true}`.
sensors: {}
