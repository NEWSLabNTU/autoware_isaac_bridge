#
# Simulator Model Parameters (NOT USED WITH ISAAC)
#
# These parameters are for Autoware's planning_simulator node which simulates
# vehicle dynamics when no external simulator is used. On Isaac, the
# PhysX vehicle (aib) handles all vehicle physics and dynamics, so these parameters
# are ignored there.
#
# This file is kept for compatibility with Autoware launch files that may
# attempt to load it, but has no effect when running on Isaac.
#

/**:
  ros__parameters:
    simulated_frame_id: "base_link"
    origin_frame_id: "map"
    vehicle_model_type: "DELAY_STEER_ACC_GEARED"
    initialize_source: "INITIAL_POSE_TOPIC"
    timer_sampling_time_ms: 25
    add_measurement_noise: False
    vel_lim: 50.0
    vel_rate_lim: 7.0
    steer_lim: 1.0
    steer_rate_lim: 5.0
    acc_time_delay: 0.1
    acc_time_constant: 0.1
    steer_time_delay: 0.24
    steer_time_constant: 0.27
    steer_dead_band: 0.0
    x_stddev: 0.0001
    y_stddev: 0.0001
    enable_road_slope_simulation: true
